# One deployable: the site and the match server behind the same origin.
#
# This was a Pages project until online play needed a Durable Object. A Pages project cannot define
# a Durable Object class at all -- it can only bind to one another Worker defines -- so the site
# folds into the Worker instead, with the built assets bound to it. Same origin, so there is no
# cross-deploy URL to wire and no CORS, and a pull request preview serves the game *and* a live
# match server behind it.
#
#   just multiplayer         runs the whole thing locally on miniflare, no account involved
#   just multiplayer-check   opens a match on it and proves the two seats are told different things
#
# Both build first, because [assets] reads dist/.

name = "elemental-arena"
main = "worker/index.ts"
compatibility_date = "2025-01-12"
compatibility_flags = ["nodejs_compat"]

# Serves every uploaded version at <alias>-<worker>.<subdomain>.workers.dev, which is what a pull
# request preview is. Off by default: without it `versions upload --preview-alias pr-N` succeeds,
# prints a version id and no URL, and the preview is reachable by nothing at all.
workers_dev = true
preview_urls = true

# Logs and traces from the Worker, readable in the dashboard rather than only through `wrangler
# tail` while somebody is watching. A match that goes wrong on a preview leaves something behind to
# read afterwards, which a live tail does not. Sampling stays at 1 because this is a game two people
# play, not a service: the free allowance is 200k events a day and we will not come near it.
[observability]
enabled = true
head_sampling_rate = 1

# Traces are off unless asked for by name -- `enabled` above only turns on logs.
[observability.traces]
enabled = true

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Not optional, and it bites from both sides. At this compatibility date the Worker answers every
# path the assets do not cover, so without this line a deep link into the game gets the match
# server's 404 instead of index.html. Past a compatibility date of 2025-04-01 the reverse is true:
# navigation requests stop reaching the Worker and /api/match/... is served the game, with a 200.
# scripts/multiplayer-smoke.mjs holds both ends of that down.
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

# Deploys the Worker -- the site and the match server in one -- on push to main.
#
# This is the half of the old cloudflare-pages.yml that was not a preview. Without it nothing
# would publish production after a merge, only pull request previews.
#
# Checks are duplicated from merge-group.yml because branch protection is unavailable on this plan.

name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: just check
      - run: just test
      - run: just build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # wrangler.toml and worker/ come from the repo; dist/ is what the build job just made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wrangler-action installs wrangler itself unless it is already there, and installing it here
      # is what stops it: package.json names its versions through pnpm's catalog:, which npm cannot
      # read at all, so the action's own `npm i wrangler@4` ends in EUNSUPPORTEDPROTOCOL. Installing
      # first also pins wrangler to the version in pnpm-lock.yaml rather than whatever @4 is today.
      # Nothing is cached in a job that holds the Cloudflare credentials: a poisoned cache would be
      # a poisoned deploy. The build job above may cache, because it publishes nothing.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Straight from node_modules rather than through cloudflare/wrangler-action -- see preview.yml
      # for why the action cannot install wrangler in this repo.
      - name: Deploy the Worker
        run: node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

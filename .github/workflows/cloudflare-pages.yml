# Deploys the built site to Cloudflare Pages. On a pull request this publishes a preview under the
# head branch's name; on a push to main it publishes production. Modelled on the same workflow in
# FactorioBlueprints/factorio-prints-firebase.
#
# Durable Objects are deliberately not here. A Pages project cannot define a DO class, so online
# play needs either a second deployable or a move to Workers with an assets binding. See the
# migration task in .llm/todo.md and the design notes on the multiplayer branch.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: just build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The runner has no standalone pnpm; wrangler-action would otherwise pick it from pnpm-lock.yaml.
          packageManager: npm
          command: pages deploy dist --project-name=elemental-arena --branch=${{ github.head_ref || github.ref_name }}

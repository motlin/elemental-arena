# Takes down the preview a pull request was given, once the pull request is closed either way.

name: Cleanup Preview

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: cleanup-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Forks and dependabot never got a preview, because they cannot read the Cloudflare secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # The checkout is what names the Worker: `versions delete` reads it from wrangler.toml, and
      # without one this job would have deleted nothing while reporting nothing, because the
      # continue-on-error below would have swallowed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installing wrangler here is what stops wrangler-action installing its own: package.json
      # names its versions through pnpm's catalog:, which npm cannot read, so the action's
      # `npm i wrangler@4` ends in EUNSUPPORTEDPROTOCOL.
      # Nothing is cached in a job that holds the Cloudflare credentials: a poisoned cache would be
      # a poisoned deploy.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install

      # Straight from node_modules rather than through cloudflare/wrangler-action -- see preview.yml
      # for why the action cannot install wrangler in this repo.
      - name: Delete the preview version
        run: node_modules/.bin/wrangler versions delete --preview-alias pr-${{ github.event.pull_request.number }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # A pull request that never got a preview has nothing to delete, and that is not a failure.
        continue-on-error: true

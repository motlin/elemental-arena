# Publishes a pull request preview of the whole deployable -- the site and the match server behind
# it -- as a Worker of its own named elemental-arena-pr-N, and puts its URL on the pull request.
#
# A Worker per pull request rather than a preview alias on one Worker, which is the obvious way and
# does not work here: "Preview URLs are not generated for Workers that implement a Durable Object",
# and the match server is a Durable Object. A version uploaded with --preview-alias takes the alias
# happily and then serves nothing at all, which reads as a broken deploy rather than a refused one.
# https://developers.cloudflare.com/workers/versions-and-deployments/preview-urls/#limitations
#
# A Worker of its own also gets a Durable Object namespace of its own, so a match opened on one pull
# request cannot be joined from another, and cleanup-preview.yml deletes the whole thing on close.
#
# Checks are duplicated from merge-group.yml because branch protection is unavailable on this plan.

name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: just check
      - run: just test
      - run: just build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist

  preview:
    # Forks and dependabot cannot read the Cloudflare secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.pull_request.number }}
      url: https://elemental-arena-pr-${{ github.event.pull_request.number }}.cmotlin.workers.dev
    steps:
      # wrangler.toml and worker/ come from the repo; dist/ is what the build job just made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wrangler-action installs wrangler itself unless it is already there, and installing it here
      # is what stops it: package.json names its versions through pnpm's catalog:, which npm cannot
      # read at all, so the action's own `npm i wrangler@4` ends in EUNSUPPORTEDPROTOCOL. Installing
      # first also pins wrangler to the version in pnpm-lock.yaml rather than whatever @4 is today.
      # Nothing is cached in a job that holds the Cloudflare credentials: a poisoned cache would be
      # a poisoned deploy. The build job above may cache, because it publishes nothing.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      # wrangler is run straight from node_modules rather than through cloudflare/wrangler-action.
      # The action insists on a package manager of its own: it reads pnpm-lock.yaml and reaches for a
      # standalone pnpm the runner does not have, and forcing it to npm instead fails on the
      # catalog: protocol in package.json, which only pnpm understands. `just install` has already
      # put the version from pnpm-lock.yaml here, so there is nothing left for the action to do.
      - name: Deploy this pull request's own Worker
        run: node_modules/.bin/wrangler deploy --name elemental-arena-pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Say where the preview is
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.issue.number;
            // Each pull request gets a Worker of its own, served at <worker name>.<subdomain>.workers.dev.
            const url = `https://elemental-arena-pr-${number}.cmotlin.workers.dev`;
            const body = `Preview: ${url}\n\nThe site and the match server are both behind it. Open it in two tabs to play online: host a match in one and follow the link it gives you in the other.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const mine = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body.startsWith("Preview: "),
            );

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }

# Publishes a pull request preview of the whole deployable -- the site and the match server behind
# it -- as a Worker version under the alias pr-N, and puts its URL on the pull request.
#
# This replaced a `pages deploy`. A Pages project cannot define a Durable Object class, so a preview
# of a multiplayer pull request served the site with no match server behind it. See wrangler.toml.
#
# Checks are duplicated from merge-group.yml because branch protection is unavailable on this plan.

name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - run: just check
      - run: just test
      - run: just build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist

  preview:
    # Forks and dependabot cannot read the Cloudflare secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    needs: build
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}-elemental-arena.cmotlin.workers.dev
    steps:
      # wrangler.toml and worker/ come from the repo; dist/ is what the build job just made.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # wrangler-action installs wrangler itself unless it is already there, and installing it here
      # is what stops it: package.json names its versions through pnpm's catalog:, which npm cannot
      # read at all, so the action's own `npm i wrangler@4` ends in EUNSUPPORTEDPROTOCOL. Installing
      # first also pins wrangler to the version in pnpm-lock.yaml rather than whatever @4 is today.
      # Nothing is cached in a job that holds the Cloudflare credentials: a poisoned cache would be
      # a poisoned deploy. The build job above may cache, because it publishes nothing.
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just install

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      # wrangler is run straight from node_modules rather than through cloudflare/wrangler-action.
      # The action insists on a package manager of its own: it reads pnpm-lock.yaml and reaches for a
      # standalone pnpm the runner does not have, and forcing it to npm instead fails on the
      # catalog: protocol in package.json, which only pnpm understands. `just install` has already
      # put the version from pnpm-lock.yaml here, so there is nothing left for the action to do.
      - name: Upload a preview version
        run: node_modules/.bin/wrangler versions upload --preview-alias pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Say where the preview is
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.issue.number;
            // A preview alias is served at <alias>-<worker name>.<subdomain>.workers.dev.
            const url = `https://pr-${number}-elemental-arena.cmotlin.workers.dev`;
            const body = `Preview: ${url}\n\nThe site and the match server are both behind it.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const mine = comments.find(
              (comment) => comment.user.type === "Bot" && comment.body.startsWith("Preview: "),
            );

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
